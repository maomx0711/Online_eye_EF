<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Center Flanker (jsPsych + WebGazer)</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            background-color: #808080;
            cursor: none;
        }

        .jspsych-display-element {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .instruction-container {
            background-color: #808080;
            color: #FFFF00;
            padding: 40px;
            font-size: 20px;
            text-align: center;
            max-width: 900px;
            margin: auto;
            overflow-y: auto;
            max-height: 90vh;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        const SCREEN_WIDTH = window.screen.width;
        const SCREEN_HEIGHT = window.screen.height;

        const PARAMS = {
            TRIAL_NUM: 120,
            REST_TRIALS: 45,
            LUMINANCE: 127,
            CUE_LOCATION_DIVISOR: 15,
            CUED_TRIAL_RATIO: 2 / 3,
            TIME_PRE_FIXATION: 4000,
            TIME_ISI: 1000,
            TIME_TARGET: 400,
            TIME_RESPONSE: 2000,
            TIME_ITI_MIN: 1500,
            TIME_ITI_MAX: 2000,
            TIME_DATA_SAVE: 600,
            MIN_TRIAL_DURATION: 10,
            ARROW_SIZE: 60,
            ARROW_GAP: 10,
            FIXATION_SIZE: 8,
            FIXATION_THICKNESS: 2,
            FULLSCREEN_DELAY: 100,
            RESPONSE_LEFT_KEY: 'n',
            RESPONSE_RIGHT_KEY: 'm',
            RESPONSE_LEFT_CODE: 2,
            RESPONSE_RIGHT_CODE: 1,
            MAX_RUN_NUM: 999
        };

        let experimentResults = {
            subjectID: '',
            runNum: 1,
            trials: []
        };

        let webgazerReady = false;
        let gazeRecording = false;
        let gazeSamples = [];
        let gazeTrialStart = null;
        let currentTrialIndex = null;
        let trialState = {};

        function initWebGazer() {
            if (!window.webgazer || webgazerReady) {
                return;
            }

            webgazer.setRegression('ridge');
            webgazer.showVideo(false);
            webgazer.showFaceOverlay(false);
            webgazer.showFaceFeedbackBox(false);
            webgazer.setGazeListener(handleGazeSample);
            webgazer.begin();
            webgazerReady = true;
        }

        function handleGazeSample(data, webgazerTimestamp) {
            if (!gazeRecording || !data) {
                return;
            }

            const now = performance.now();
            const sample = {
                trial: currentTrialIndex,
                t: now,
                timeFromStimulus: gazeTrialStart ? now - gazeTrialStart : null,
                webgazerTimestamp: typeof webgazerTimestamp === 'number' ? webgazerTimestamp : null,
                x: data.x ?? null,
                y: data.y ?? null,
                confidence: data.confidence ?? null,
                pupilSize: data.pupilSize ?? null,
                pupilLeft: data.leftPupilSize ?? null,
                pupilRight: data.rightPupilSize ?? null
            };

            if (data.eyeFeatures) {
                sample.eyeFeatures = data.eyeFeatures;
            }

            gazeSamples.push(sample);
        }

        function startGazeRecording(trialIndex) {
            gazeSamples = [];
            gazeRecording = true;
            gazeTrialStart = performance.now();
            currentTrialIndex = trialIndex + 1;
            trialState.stimulusOnset = gazeTrialStart;
        }

        function stopGazeRecording() {
            gazeRecording = false;
            return gazeSamples.slice();
        }

        function shuffle(array) {
            const arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildCueLocations() {
            const baseCount = Math.floor(PARAMS.TRIAL_NUM / PARAMS.CUE_LOCATION_DIVISOR);
            const doubleCount = baseCount * 2;
            const locations = [];
            locations.push(...Array(doubleCount).fill(1));
            for (let i = 2; i <= 9; i++) {
                locations.push(...Array(baseCount).fill(i));
            }
            return locations;
        }

        function getCueDirection(type, loc) {
            if (loc === -1) {
                return null;
            }
            if (type === 1) {
                return 'right';
            }
            if (type === 3) {
                return 'left';
            }
            if (type === 2) {
                return loc === 1 ? 'right' : 'left';
            }
            if (type === 4) {
                return loc === 1 ? 'left' : 'right';
            }
            return null;
        }

        function generateTrials() {
            const trialOrder = shuffle(Array.from({ length: PARAMS.TRIAL_NUM }, (_, i) => i + 1));
            const cueLocations = buildCueLocations();
            const cuedLimit = Math.floor(PARAMS.TRIAL_NUM * PARAMS.CUED_TRIAL_RATIO);

            return trialOrder.map((value, index) => {
                const type = (value % 4) + 1;
                const cued = value <= cuedLimit;
                const loc = cued ? cueLocations[value - 1] : -1;
                const targetCode = (type === 1 || type === 2) ? 1 : 2;
                const targetDir = targetCode === 1 ? 'right' : 'left';
                const congruent = type === 1 || type === 3;
                return {
                    index: index + 1,
                    type,
                    cueLocation: loc,
                    targetCode,
                    targetDir,
                    congruent,
                    cueDir: getCueDirection(type, loc)
                };
            });
        }

        function getArrowPositions(centerX, centerY) {
            const positions = [];
            const half = PARAMS.ARROW_SIZE / 2;
            const distance = PARAMS.ARROW_SIZE + PARAMS.ARROW_GAP;
            for (let positionIndex = 1; positionIndex <= 9; positionIndex++) {
                let topY;
                if (positionIndex <= 5) {
                    topY = centerY - half + distance * (positionIndex - 1);
                } else {
                    topY = centerY - half - distance * (positionIndex - 5);
                }
                positions.push({ x: centerX, y: topY + half });
            }
            return positions;
        }

        function drawBackground(ctx) {
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }

        function drawFixation(ctx, centerX, centerY) {
            ctx.fillStyle = '#FFFF00';
            const halfSize = PARAMS.FIXATION_SIZE / 2;
            const halfThick = PARAMS.FIXATION_THICKNESS / 2;
            ctx.fillRect(centerX - halfSize, centerY - halfThick, PARAMS.FIXATION_SIZE, PARAMS.FIXATION_THICKNESS);
            ctx.fillRect(centerX - halfThick, centerY - halfSize, PARAMS.FIXATION_THICKNESS, PARAMS.FIXATION_SIZE);
        }

        function drawArrow(ctx, centerX, centerY, direction, color) {
            const dirRad = direction === 'right' ? 0 : Math.PI;
            const length = PARAMS.ARROW_SIZE * 0.6;
            const width = PARAMS.ARROW_SIZE * 0.2;
            const head = PARAMS.ARROW_SIZE * 0.3;

            const points = [
                [-length / 2, -width / 2],
                [length / 2, -width / 2],
                [length / 2, -head / 2],
                [length / 2 + head, 0],
                [length / 2, head / 2],
                [length / 2, width / 2],
                [-length / 2, width / 2]
            ];

            ctx.fillStyle = color;
            ctx.beginPath();
            points.forEach((p, i) => {
                const x = p[0] * Math.cos(dirRad) - p[1] * Math.sin(dirRad) + centerX;
                const y = p[0] * Math.sin(dirRad) + p[1] * Math.cos(dirRad) + centerY;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.closePath();
            ctx.fill();
        }

        function drawFlankers(ctx, centerX, centerY, targetDir, congruent) {
            const positions = getArrowPositions(centerX, centerY);
            positions.forEach((pos, index) => {
                const isCenter = index === 0;
                let dir = targetDir;
                if (!congruent && !isCenter) {
                    dir = targetDir === 'right' ? 'left' : 'right';
                }
                drawArrow(ctx, pos.x, pos.y, dir, '#222222');
            });
        }

        function drawCue(ctx, centerX, centerY, cueDir, cueLocation) {
            if (!cueDir || cueLocation === -1) {
                return;
            }
            const positions = getArrowPositions(centerX, centerY);
            const pos = positions[cueLocation - 1];
            if (pos) {
                drawArrow(ctx, pos.x, pos.y, cueDir, '#FFFF00');
            }
        }

        function drawTrialStimulus(ctx, trial) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            drawBackground(ctx);
            drawFixation(ctx, centerX, centerY);
            drawFlankers(ctx, centerX, centerY, trial.targetDir, trial.congruent);
            drawCue(ctx, centerX, centerY, trial.cueDir, trial.cueLocation);
        }

        function drawFixationOnly(ctx) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            drawBackground(ctx);
            drawFixation(ctx, centerX, centerY);
        }

        function registerResponse(key, rt, source) {
            trialState.responded = true;
            trialState.response = key;
            trialState.rt = rt;
            trialState.responseSource = source;
        }

        function adjustResponseRt(responseWindowStart, stimulusOnset, responseRt) {
            if (responseRt === null || responseRt === undefined) {
                return null;
            }
            if (!responseWindowStart || !stimulusOnset) {
                return responseRt;
            }
            return responseWindowStart - stimulusOnset + responseRt;
        }

        function buildTrialResult(trial, gazeData) {
            const responseKey = trialState.response;
            const responseCode = responseKey === PARAMS.RESPONSE_RIGHT_KEY
                ? PARAMS.RESPONSE_RIGHT_CODE
                : responseKey === PARAMS.RESPONSE_LEFT_KEY
                    ? PARAMS.RESPONSE_LEFT_CODE
                    : 0;
            const correct = responseCode === trial.targetCode ? 1 : 0;

            return {
                trialNumber: trial.index,
                type: trial.type,
                cueLocation: trial.cueLocation,
                cueAtCenter: trial.cueLocation === 1 ? 1 : 0,
                targetDirection: trial.targetDir,
                targetCode: trial.targetCode,
                congruent: trial.congruent ? 1 : 2,
                response: responseKey || '',
                responseCode,
                rt: trialState.rt,
                correct,
                stimulusOnset: trialState.stimulusOnset,
                gazeSamples: gazeData,
                gazeSampleCount: gazeData.length
            };
        }

        function sanitizeFilename(value) {
            const sanitized = String(value || '')
                .replace(/[\\/:*?"<>|]+/g, '_')
                .replace(/\.\.+/g, '_')
                .replace(/^\.+/, '')
                .trim();
            return sanitized.length > 0 ? sanitized : 'subject';
        }

        function saveData() {
            const safeSubject = sanitizeFilename(experimentResults.subjectID);
            const safeRun = Number.isFinite(experimentResults.runNum) ? experimentResults.runNum : 1;
            const json = JSON.stringify(experimentResults, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${safeSubject}_run${safeRun}_centerflanker.json`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        const jsPsych = initJsPsych({
            on_finish: function() {
                if (webgazerReady) {
                    webgazer.end();
                }
            }
        });

        let subjectID = '';
        let runNum = 1;
        const timeline = [];
        const trials = generateTrials();

        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                { prompt: '被试姓名:', name: 'subjectID', required: true },
                { prompt: 'Run编号:', name: 'runNum', required: true }
            ],
            on_finish: function(data) {
                subjectID = data.response.subjectID;
                const parsedRun = parseInt(data.response.runNum, 10);
                const runIsValid = Number.isFinite(parsedRun) && parsedRun > 0 && parsedRun <= PARAMS.MAX_RUN_NUM;
                if (!runIsValid) {
                    console.warn('Run编号无效 (invalid run number)，须为 1-999 的正整数，已自动设为 1');
                }
                runNum = runIsValid ? parsedRun : 1;
                experimentResults.subjectID = subjectID;
                experimentResults.runNum = runNum;
                jsPsych.data.addProperties({
                    subject_id: subjectID,
                    run_number: runNum,
                    run_number_valid: runIsValid
                });
            }
        });

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="instruction-container"><h2>眼动初始化</h2><p>请允许浏览器使用摄像头</p><p>保持面部在屏幕中央</p><p>按 空格键 继续</p></div>',
            choices: [' '],
            on_start: function() {
                initWebGazer();
            }
        });

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="instruction-container"><h2>任务说明</h2><p>请注视屏幕中心的箭头阵列。</p><p>中间箭头为目标，按 N (左键) 表示向左，按 M (右键) 表示向右。</p><p>黄色箭头为提示线索，可能出现在任意位置。</p><p>按 空格键 进入全屏并开始。</p></div>',
            choices: [' '],
            on_finish: function() {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
                setTimeout(() => {
                    document.body.style.overflow = 'hidden';
                    document.documentElement.style.overflow = 'hidden';
                }, PARAMS.FULLSCREEN_DELAY);
            }
        });

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="instruction-container"><h2>等待触发</h2><p>按 S 键开始实验</p></div>',
            choices: ['s']
        });

        timeline.push({
            type: jsPsychCanvasKeyboardResponse,
            stimulus: function(c) {
                drawFixationOnly(c.getContext('2d'));
            },
            canvas_size: [SCREEN_WIDTH, SCREEN_HEIGHT],
            choices: jsPsych.NO_KEYS,
            trial_duration: PARAMS.TIME_PRE_FIXATION
        });

        trials.forEach((trial, trialIndex) => {
            const isi = {
                type: jsPsychCanvasKeyboardResponse,
                stimulus: function(c) {
                    drawFixationOnly(c.getContext('2d'));
                },
                canvas_size: [SCREEN_WIDTH, SCREEN_HEIGHT],
                choices: jsPsych.NO_KEYS,
                trial_duration: PARAMS.TIME_ISI
            };
            timeline.push(isi);

            const target = {
                type: jsPsychCanvasKeyboardResponse,
                stimulus: function(c) {
                    drawTrialStimulus(c.getContext('2d'), trial);
                },
                canvas_size: [SCREEN_WIDTH, SCREEN_HEIGHT],
                choices: [PARAMS.RESPONSE_LEFT_KEY, PARAMS.RESPONSE_RIGHT_KEY],
                response_ends_trial: false,
                trial_duration: PARAMS.TIME_TARGET,
                on_start: function() {
                    trialState = {
                        responded: false,
                        response: null,
                        rt: null,
                        responseSource: null,
                        stimulusOnset: null,
                        responseWindowStart: null
                    };
                    startGazeRecording(trialIndex);
                },
                on_finish: function(data) {
                    if (data.response !== null) {
                        registerResponse(data.response, data.rt, 'target');
                    }
                }
            };
            timeline.push(target);

            const response = {
                type: jsPsychCanvasKeyboardResponse,
                stimulus: function(c) {
                    drawFixationOnly(c.getContext('2d'));
                },
                canvas_size: [SCREEN_WIDTH, SCREEN_HEIGHT],
                choices: function() {
                    return trialState.responded ? jsPsych.NO_KEYS : [PARAMS.RESPONSE_LEFT_KEY, PARAMS.RESPONSE_RIGHT_KEY];
                },
                trial_duration: function() {
                    return trialState.responded ? PARAMS.MIN_TRIAL_DURATION : PARAMS.TIME_RESPONSE;
                },
                on_start: function() {
                    trialState.responseWindowStart = performance.now();
                },
                on_finish: function(data) {
                    if (!trialState.responded && data.response !== null) {
                        const rt = adjustResponseRt(trialState.responseWindowStart, trialState.stimulusOnset, data.rt);
                        registerResponse(data.response, rt, 'response');
                    }
                    const gazeData = stopGazeRecording();
                    const trialResult = buildTrialResult(trial, gazeData);
                    experimentResults.trials.push(trialResult);
                    jsPsych.data.addDataToLastTrial(trialResult);
                }
            };
            timeline.push(response);

            const iti = {
                type: jsPsychCanvasKeyboardResponse,
                stimulus: function(c) {
                    drawFixationOnly(c.getContext('2d'));
                },
                canvas_size: [SCREEN_WIDTH, SCREEN_HEIGHT],
                choices: jsPsych.NO_KEYS,
                trial_duration: function() {
                    return PARAMS.TIME_ITI_MIN + Math.random() * (PARAMS.TIME_ITI_MAX - PARAMS.TIME_ITI_MIN);
                }
            };
            timeline.push(iti);

            if ((trialIndex + 1) % PARAMS.REST_TRIALS === 0 && trialIndex + 1 < trials.length) {
                timeline.push({
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: '<div class="instruction-container"><h2>休息时间</h2><p>请闭眼休息一会儿</p><p>按 S 键继续</p></div>',
                    choices: ['s']
                });
                timeline.push({
                    type: jsPsychCanvasKeyboardResponse,
                    stimulus: function(c) {
                        drawFixationOnly(c.getContext('2d'));
                    },
                    canvas_size: [SCREEN_WIDTH, SCREEN_HEIGHT],
                    choices: jsPsych.NO_KEYS,
                    trial_duration: PARAMS.TIME_PRE_FIXATION
                });
            }
        });

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="instruction-container"><h2>实验结束</h2><p>正在保存数据...</p></div>',
            choices: jsPsych.NO_KEYS,
            trial_duration: PARAMS.TIME_DATA_SAVE,
            on_finish: function() {
                saveData();
            }
        });

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="instruction-container"><h2>感谢参与</h2><p>请按空格键退出</p></div>',
            choices: [' ']
        });

        jsPsych.run(timeline);
    </script>
</body>
</html>
